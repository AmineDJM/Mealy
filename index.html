<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MealPrepper · Milano</title>
<meta name="description" content="Milan dark kitchen: personalised healthy meals for athletes, delivered to your door.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--card:#ffffff;--card2:#eef3fb;--line:#dbe4f2;--txt:#0b1f44;--mut:#5d6f8f;--acc:#1557ff;--acc2:#0b3fd1;--accs:#e6eeff;--red:#e5484d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font:inherit;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.hidden{display:none!important}
.btn{background:var(--acc);color:#fff;font-weight:700;padding:13px 18px;border-radius:12px;transition:.15s}
.btn:hover{background:var(--acc2)}
.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--acc);border:1px solid var(--line)}
.btn.block{width:100%}
.muted{color:var(--mut)}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#1557ff 0,#0b3fd1 45%,#f4f7fc 45%)}
.auth-box{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 50px rgba(11,31,68,.15)}
.logo{font-weight:800;font-size:28px;letter-spacing:-.5px;color:var(--txt)}.logo span{color:var(--acc)}
.auth-box form{display:grid;gap:12px;margin-top:20px}
.tabs{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:12px;margin-top:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
.loc{flex:1;display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:0;cursor:pointer;text-align:left}
.loc .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--accs);flex:none}
.loc div{min-width:0}.loc small{display:block;color:var(--mut);font-size:11px}
.loc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.cartbtn{position:relative;background:var(--acc);color:#fff;font-weight:700;padding:10px 16px;border-radius:999px;white-space:nowrap}
.badge{position:absolute;top:-6px;right:-6px;background:var(--txt);color:#fff;font-size:11px;border-radius:999px;padding:2px 6px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accs);color:var(--acc);display:grid;place-items:center;font-weight:700;flex:none}
main{max-width:1200px;margin:auto;padding:20px 16px 80px}
.hero{background:linear-gradient(120deg,#1557ff,#0b3fd1);color:#fff;border-radius:20px;padding:22px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
.hero h1{font-size:26px;letter-spacing:-.5px}.hero .muted{color:#c9d8ff}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 14px}
.stat b{font-size:18px;display:block}.stat small{opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;margin:22px 0 14px;padding-bottom:4px}
.chip{padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:14px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.plus{background:var(--accs);color:var(--acc);border-color:var(--acc)}
h2{font-size:20px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;text-align:left}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(21,87,255,.12);border-color:#b9cbf0}
.img{position:relative;overflow:hidden}.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .img{height:150px;display:grid;place-items:center;font-size:62px;background:var(--card2)}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16px}
.card.add{border:2px dashed var(--acc);background:var(--accs);align-items:center;justify-content:center;min-height:260px;color:var(--acc);font-weight:700;gap:8px;text-align:center;padding:16px}
.card.add .big{font-size:56px;line-height:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut)}
.tag.g{color:var(--acc);background:var(--accs);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-weight:700;color:var(--acc)}
.macros{display:flex;gap:10px;font-size:12px;color:var(--mut)}
.macros b{color:var(--txt)}
/* modal & drawer */
.overlay{position:fixed;inset:0;background:rgba(11,31,68,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0}
@media(min-width:700px){.modal{border-radius:20px}}
.modal .img{height:170px;font-size:90px;display:grid;place-items:center;position:relative;background:var(--card2)}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:#fff;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.mbody{padding:18px;display:grid;gap:14px}
.ing{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card2);border-radius:12px;gap:10px}
.ing.off{opacity:.5}.ing.off span.n{text-decoration:line-through}
.ing small{color:var(--mut)}
.tog{width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);font-weight:700;flex:none}
.tog.add{background:var(--acc);color:#fff;border:0}
.qty{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:12px;padding:6px}
.qty button{width:32px;height:32px;border-radius:9px;background:#fff;font-size:18px}
.sticky{position:sticky;bottom:0;background:#fff;padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:12px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;text-align:center}
.size b{display:block;font-size:15px}.size small{color:var(--mut);font-size:12px}
.size.on{border-color:var(--acc);background:var(--accs)}.size.on b{color:var(--acc)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:#fff;z-index:60;border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:.25s;box-shadow:-10px 0 30px rgba(11,31,68,.1)}
.drawer.open{transform:none}
.dhead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dbody{flex:1;overflow:auto;padding:16px;display:grid;gap:10px;align-content:start}
.citem{background:var(--card2);border-radius:14px;padding:12px;display:grid;gap:6px}
.citem small{color:var(--mut)}
.dfoot{padding:16px;border-top:1px solid var(--line);display:grid;gap:8px}
.sum{display:flex;justify-content:space-between;font-size:14px}.sum.t{font-size:17px;font-weight:800}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.payopt{padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;font-weight:600;font-size:14px}
.payopt.on{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.steps{display:grid;gap:14px;margin:6px 0}
.step{display:flex;gap:12px;align-items:center;color:var(--mut)}
.step .c{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.step.done{color:var(--txt)}.step.done .c{background:var(--acc);border-color:var(--acc);color:#fff}
.step.now .c{animation:p 1s infinite}
@keyframes p{50%{box-shadow:0 0 0 6px var(--accs)}}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width 1s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--txt);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:99}
.sugg{display:grid;gap:6px;max-height:240px;overflow:auto}
.sugg button{text-align:left;padding:10px 12px;border-radius:10px;background:var(--card2)}
.sugg button:hover{background:var(--accs)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px}
.pick button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.emo button{font-size:22px;padding:4px 8px}
.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:32px;box-shadow:0 10px 24px rgba(21,87,255,.4);z-index:30}
.pbar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.pbar i.over{background:#f59e0b}
.day{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.meal-row{display:flex;justify-content:space-between;font-size:14px;gap:8px}.meal-row span:last-child{color:var(--mut);white-space:nowrap}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mut)}
.week i{width:100%;max-width:34px;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px}
.goalline{position:relative}
label.f{display:grid;gap:5px;font-size:13px;color:var(--mut);font-weight:600}
/* coach */
.coachfab{position:fixed;right:20px;bottom:92px;z-index:31;display:flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;border-radius:999px;background:linear-gradient(135deg,#1557ff,#7b5cff);color:#fff;font-weight:700;box-shadow:0 12px 30px rgba(91,92,255,.45)}
.coachfab .ai{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:16px;position:relative}
.coachfab .ai:after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:ring 1.8s infinite}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
.chat{position:fixed;right:20px;bottom:20px;width:400px;max-width:calc(100vw - 32px);height:640px;max-height:calc(100vh - 40px);background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(11,31,68,.35);z-index:70;display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right;transition:transform .25s,opacity .25s}
.chat.shut{opacity:0;transform:scale(.6) translateY(40px);pointer-events:none}
.chead{background:linear-gradient(135deg,#1557ff,#7b5cff);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.chead .av{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:22px}
.chead small{opacity:.85;display:flex;align-items:center;gap:6px}.chead small:before{content:'';width:8px;height:8px;border-radius:50%;background:#4ade80}
.cmsgs>*{flex-shrink:0}
.cmsgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;animation:pop .25s ease-out}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.wide{max-width:100%;width:100%;padding:0;overflow:hidden}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.typing{display:flex;gap:4px;padding:14px}.typing i{width:7px;height:7px;border-radius:50%;background:#9fb3d9;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.4}}
.qchips{display:flex;flex-wrap:wrap;gap:6px;animation:pop .3s}
.qchips button{padding:8px 11px;border-radius:999px;border:1px solid #c7d6f5;background:#fff;color:var(--acc);font-size:13px;font-weight:600}
.qchips button:hover{background:var(--accs)}
.cin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
.cin input{border-radius:999px}.cin button{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;flex:none}
.cmeal .img{height:140px;font-size:60px;display:grid;place-items:center;background:var(--card2)}
.cmeal .b{padding:12px;display:grid;gap:8px}
.gauge{display:grid;gap:4px;font-size:12px;color:var(--mut)}
.ipills{display:flex;flex-wrap:wrap;gap:4px}.ipills span{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--accs);color:var(--acc);font-weight:600}
.why{font-size:12.5px;color:var(--mut);display:grid;gap:3px;padding-left:2px}
.cbtns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px}.cbtns .btn{padding:10px 6px;font-size:13px}
/* map */
.tmap{height:280px;border-radius:16px;overflow:hidden;background:#e8eef8;position:relative;z-index:0}
.pin{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px rgba(11,31,68,.3);border:3px solid var(--acc)}
.pin.rider{border-color:#7b5cff;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.rider-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2)}
.rav{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#1557ff,#7b5cff);display:grid;place-items:center;font-size:24px}
/* plan */
.planhead{background:linear-gradient(135deg,#0b1f44,#1557ff);color:#fff;border-radius:20px;padding:20px;display:grid;gap:14px}
.planhead .stats .stat{background:rgba(255,255,255,.12)}
.weekgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding:4px 2px 12px;margin-top:14px}
.dcol{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;align-content:start}
.dcol.today{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.slot{display:flex;gap:10px;align-items:center;padding:6px;border-radius:12px;background:var(--card2);text-align:left;width:100%;transition:.15s}
.slot:hover{background:var(--accs)}
.slot .th{width:52px;height:52px;border-radius:10px;flex:none;font-size:24px;display:grid;place-items:center;background:#fff;position:relative;overflow:hidden}
.slot .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot b{font-size:13px;display:block;line-height:1.2}.slot small{font-size:11px;color:var(--mut)}
.slot.empty{border:1.5px dashed #b9cbf0;background:#fff;color:var(--acc);justify-content:center;min-height:64px;font-weight:600;font-size:13px}
.slabel{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.pickrow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--card2);text-align:left;width:100%}
.pickrow.on{outline:2px solid var(--acc);background:var(--accs)}
.pickrow .th{width:54px;height:54px;border-radius:10px;flex:none;font-size:26px;display:grid;place-items:center;background:#fff;position:relative;overflow:hidden}
.pickrow .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hbtn{background:#fff;color:var(--acc);font-weight:700;padding:11px 16px;border-radius:12px}
@media(max-width:520px){.chat{right:0;bottom:0;width:100%;max-width:none;height:100%;max-height:none;border-radius:0}.coachfab span.t{display:none}.coachfab{padding:12px}}
@media(max-width:520px){.hwrap .hide-s{display:none}.hero h1{font-size:21px}}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth">
  <div class="auth-box">
    <div class="logo">Meal<span>Prepper</span> 💪</div>
    <p class="muted" style="margin-top:6px">Milan dark kitchen · Tailor-made meals for athletes, delivered in 25 min.</p>
    <div class="tabs"><button class="on" data-t="login">Log in</button><button data-t="signup">Sign up</button></div>
    <form id="authForm">
      <input id="aName" placeholder="First name" class="hidden">
      <input id="aEmail" type="email" placeholder="Email" required>
      <input id="aPass" type="password" placeholder="Password" required minlength="4">
      <div id="signupExtra" class="hidden" style="display:grid;gap:12px">
        <select id="aSport"><option>Bodybuilding</option><option>Running</option><option>Football</option><option>Cycling</option><option>CrossFit</option><option>Tennis</option><option>Swimming</option></select>
        <div class="kv"><label class="f">Sex<select id="aSex"><option value="m">Male</option><option value="f">Female</option></select></label><label class="f">Weight (kg)<input id="aWeight" type="number" value="75" min="30" max="200"></label></div>
        <label class="f">Goal<select id="aGoal"><option value="perf">Performance</option><option value="cut">Weight loss</option><option value="bulk">Muscle gain</option><option value="maint">Maintenance</option></select></label>
        <div class="kv"><label class="f">Calories / day<input id="aKcal" type="number" min="1000" max="6000"></label><label class="f">Protein / day (g)<input id="aProt" type="number" min="30" max="400"></label></div>
        <small class="muted">We suggest targets from your sex, weight &amp; goal — adjust freely.</small>
      </div>
      <button class="btn block" id="authBtn">Log in</button>
      <p id="authErr" style="color:var(--red);font-size:14px"></p>
      <button type="button" class="btn ghost block" id="demoBtn">Continue in demo mode</button>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header><div class="hwrap">
    <div class="logo hide-s" style="font-size:22px">Meal<span>Prepper</span></div>
    <button class="loc" id="locBtn"><span class="dot"></span><div><small>Deliver to · <span id="eta">25–30 min</span></small><b id="locTxt">Choose an address</b></div></button>
    <button class="cartbtn" id="cartBtn">🛒 <span id="cartTot">€0.00</span><span class="badge hidden" id="cartN">0</span></button>
    <button class="avatar" id="avatar" title="My profile">?</button>
  </div></header>
  <main>
    <div class="hero">
      <div><p class="muted" id="hello">Ciao 👋</p><h1>Your meal of the day, built for you</h1><p class="muted" style="margin-top:6px">Small €10 · Medium €12 · Large €14</p><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="hbtn" onclick="cat='Meal plan';if(!plan)generatePlan();render()">📅 Plan my week</button><button class="hbtn" style="background:rgba(255,255,255,.15);color:#fff" onclick="toggleChat(true)">✨ Ask the coach</button></div></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="menu"></div>
  </main>
  <button class="fab" id="fab" title="Create my recipe">+</button>
  <button class="coachfab" id="coachFab"><span class="ai">✨</span><span class="t">Coach AI</span></button>
  <div class="chat shut" id="chat">
    <div class="chead"><div class="av">🤖</div><div style="flex:1"><b>MealPrepper Coach</b><small>Online · knows your goals</small></div><button class="tog" style="background:rgba(255,255,255,.2);border:0;color:#fff" onclick="toggleChat()">✕</button></div>
    <div class="cmsgs" id="cmsgs"></div>
    <form class="cin" id="cform"><input id="cq" placeholder="e.g. Pre-match meal, 40g protein, no fish" autocomplete="off"><button>➤</button></form>
  </div>
</div>

<div class="overlay hidden" id="ov"><div class="modal" id="modal"></div></div>
<div class="drawer" id="drawer"></div>
<div class="toast hidden" id="toast"></div>

<script>

function suggest(sex,w,goal,h){const bmr=10*w+6.25*(h||(sex==='f'?165:178))-5*28+(sex==='f'?-161:5),tdee=bmr*1.65;
 return{kcal:Math.round((tdee*{perf:1.1,cut:.8,bulk:1.15,maint:1}[goal])/50)*50,prot:Math.round(w*{perf:1.8,cut:2.2,bulk:2,maint:1.6}[goal])}}

 mode=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));

  out.push({id:'D'+d+j,at:+at,arrive:+at+25*60000,items:[{n:`${m.n} (${SIZES[sz].n})`,e:m.e,p:SIZES[sz].p,q:1,k:s.k,pr:s.pr}],total:SIZES[sz].p+3,addr:'Piazza del Duomo, Milano',pay:'card'})}
 return out}

function login(u){me=u;me.prot=me.prot||Math.round((me.weight||75)*2);me.sex=me.sex||'m';if(!GOALS[me.goal])me.goal='perf';cart=u.cart||[];loc=u.loc||null;orders=u.orders||[];recipes=u.recipes||[];plan=u.plan&&u.plan.days[0].length===5?u.plan:null;save();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');render();if(!loc)openLoc()}

// ---------- LOCATION ----------
function dist(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function eta(){if(!loc)return[25,30];const d=dist(KITCHEN,loc);const m=Math.round(12+d*4);return[m,m+5]}
function fee(){if(!loc)return 1.99;const d=dist(KITCHEN,loc);return d<2?0.99:d<5?1.99:2.99}
function openLoc(){
 modal(`<div class="mbody"><div class="row"><h2 style="margin:0">📍 Delivery address</h2><button class="tog" onclick="closeM()">✕</button></div>
 <button class="btn block" id="geo">📡 Use my current location</button>
 <input id="locQ" placeholder="Search an address in Milan…" autocomplete="off">
 <div class="sugg" id="sugg"></div><p class="muted" style="font-size:13px">Delivery area: Milano città · Kitchen: ${KITCHEN.name}</p></div>`);
 const draw=q=>{$('#sugg').innerHTML=PLACES.filter(p=>p.n.toLowerCase().includes(q.toLowerCase())).map(p=>`<button data-i="${PLACES.indexOf(p)}">📍 ${p.n} <small class="muted">· ${dist(KITCHEN,p).toFixed(1)} km</small></button>`).join('')+(q.length>3?`<button data-custom="1">➕ Use “${esc(q)}”</button>`:'');
  $('#sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>setLoc(b.dataset.custom?{n:q+', Milano',lat:45.46+Math.random()*.03,lng:9.17+Math.random()*.04}:PLACES[b.dataset.i]))};
 draw('');$('#locQ').oninput=e=>draw(e.target.value);
 $('#geo').onclick=()=>{if(!navigator.geolocation)return;$('#geo').textContent='Locating…';navigator.geolocation.getCurrentPosition(p=>{
  const c={lat:p.coords.latitude,lng:p.coords.longitude},inMilan=dist(KITCHEN,c)<15;
  setLoc(inMilan?{n:`My location (${c.lat.toFixed(4)}, ${c.lng.toFixed(4)})`,...c}:{...PLACES[0],n:'Out of zone → Piazza del Duomo, Milano'});
 },()=>{$('#geo').textContent='📡 Location denied — pick below'})};
}
function setLoc(p){loc=p;save();closeM();render();toast('Address updated · '+eta()[0]+' min')}
$('#locBtn').onclick=openLoc;

// ---------- RENDER ----------
function mealStats(ids,size='M'){let k=0,pr=0;ids.forEach(i=>{k+=ING[i].k;pr+=ING[i].pr});const f=SIZES[size].f;return{k:Math.round(k*f),pr:Math.round(pr*f)}}
function render(){
 $('#avatar').textContent=me.name[0].toUpperCase();$('#hello').textContent=`Ciao ${me.name} 👋 · ${me.sport}`;
 $('#locTxt').textContent=loc?loc.n:'Choose an address';const [a,b]=eta();$('#eta').textContent=`${a}–${b} min`;
 const kc=cart.reduce((s,c)=>s+c.k*c.q,0),prot=cart.reduce((s,c)=>s+c.pr*c.q,0);
 $('#stats').innerHTML=`<div class="stat"><small>Goal</small><b>${GOALS[me.goal]}</b></div><div class="stat"><small>Cart kcal</small><b>${kc} / ${me.kcal}</b></div><div class="stat"><small>Cart protein</small><b>${prot} g <span style="font-size:12px;opacity:.8">/ ${me.prot} g</span></b></div>`;
 const cats=['For you','Meal plan','My recipes','My orders','Bowls','Salads','Pasta','Vegan','Breakfast','Drinks'];
 $('#chips').innerHTML=`<button class="chip plus" data-new="1">＋ New recipe</button>`+cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c==='Meal plan'?'📅 ':''}${c}${c==='My recipes'&&recipes.length?` (${recipes.length})`:''}${c==='My orders'&&orders.length?` (${orders.length})`:''}</button>`).join('');
 $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(b.dataset.new)return openBuilder();cat=b.dataset.c;render()});
 const mealCard=m=>{const s=mealStats(m.ing);return`<button class="card" onclick="openMeal('${m.id}')"><div class="img">${m.e}${pic(m.img)}</div><div class="body"><div class="tags">${m.mine?'<span class="tag g">★ My recipe</span>':m.goal.includes(me.goal)?'<span class="tag g">✓ Fits your goal</span>':''}<span class="tag">${m.cat}</span></div><h3>${esc(m.n)}</h3><p class="muted" style="font-size:13px">${esc(m.d)}</p><div class="row" style="margin-top:auto"><div class="macros"><span><b>${s.k}</b> kcal</span><span><b>${s.pr}g</b> protein</span></div><span class="price">from €10</span></div></div></button>`};
 const drinkCard=d=>`<button class="card" onclick="addDrink('${d.id}')"><div class="img" style="height:120px;font-size:48px">${d.e}${pic(d.img)}</div><div class="body"><h3>${d.n}</h3><p class="muted" style="font-size:13px">${d.d}</p><div class="row" style="margin-top:auto"><div class="macros"><span><b>${d.k}</b> kcal</span><span><b>${d.pr}g</b> protein</span></div><span class="price">${eur(d.p)} <span class="tog add" style="display:inline-grid;place-items:center;margin-left:6px">+</span></span></div></div></button>`;
 const addCard=`<button class="card add" onclick="openBuilder()"><span class="big">+</span>Create my own recipe<small class="muted" style="font-weight:500">Pick your ingredients, save it, reorder anytime</small></button>`;
 const mine=`<h2>⭐ My recipes</h2><div class="grid">${addCard}${recipes.map(mealCard).join('')}</div>`;
 let html='';
 if(cat==='For you'){
  const rec=MEALS.filter(m=>m.goal.includes(me.goal));
  html+=`<h2>🎯 Recommended for ${GOALS[me.goal].toLowerCase()}</h2><div class="grid">${rec.map(mealCard).join('')}</div>`+mine;
  html+=`<h2>🍽️ All meals</h2><div class="grid">${MEALS.filter(m=>!rec.includes(m)).map(mealCard).join('')}</div>`;
  html+=`<h2>🥤 Drinks</h2><div class="grid">${DRINKS.map(drinkCard).join('')}</div>`;
 }else if(cat==='My recipes')html+=mine;
 else if(cat==='Meal plan')html+=renderPlan();
 else if(cat==='My orders');
 else if(cat==='Drinks')html+=`<h2>🥤 Drinks</h2><div class="grid">${DRINKS.map(drinkCard).join('')}</div>`;
 else html+=`<h2>${cat}</h2><div class="grid">${MEALS.filter(m=>m.cat===cat).map(mealCard).join('')}</div>`;
 if(cat==='My orders')html+=!orders.length?`<h2>🧾 My orders</h2><p class="muted">No orders yet — your first one is a tap away 🥗</p>`:`<h2>🧾 My orders</h2><div class="grid">${orders.slice().reverse().map(o=>`<button class="card" onclick="track('${o.id}')"><div class="body"><div class="row"><b>#${o.id}</b><span class="tag ${Date.now()<o.arrive?'g':''}">${Date.now()<o.arrive?'On its way':'Delivered'}</span></div><small class="muted">${new Date(o.at).toLocaleString('en-GB')} · ${o.items.length} item(s)</small><div class="row"><span class="muted" style="font-size:13px">${esc(o.addr)}</span><b>${eur(o.total)}</b></div></div></button>`).join('')}</div>`;
 $('#menu').innerHTML=html;
 const n=cart.reduce((s,c)=>s+c.q,0),t=cart.reduce((s,c)=>s+c.p*c.q,0);
 $('#cartTot').textContent=eur(t);$('#cartN').textContent=n;$('#cartN').classList.toggle('hidden',!n);
}

// ---------- MEAL CUSTOMIZER ----------
let cfg;
function openMeal(id){const m=allMeals().find(x=>x.id===id);cfg={id,ing:[...m.ing],q:1,note:'',size:'M'};drawMeal()}
function drawMeal(){
 const m=allMeals().find(x=>x.id===cfg.id),s=mealStats(cfg.ing,cfg.size),p=SIZES[cfg.size].p;
 const all=[...new Set([...m.ing,...(m.ext||[])])];
 modal(`<div class="img" style="height:220px">${m.e}${pic(m.img)}<button class="close" onclick="closeM()">✕</button></div>
 <div class="mbody"><div><h2 style="margin:0">${esc(m.n)}</h2><p class="muted">${esc(m.d)}</p></div>
 <div><b>Size</b></div>
 <div class="sizes">${Object.entries(SIZES).map(([k,z])=>`<button class="size ${cfg.size===k?'on':''}" onclick="cfg.size='${k}';keep(drawMeal)"><b>${z.n}</b><small>${eur(z.p)}</small></button>`).join('')}</div>
 <div class="kv"><div class="stat" style="background:var(--card2)"><small>Calories</small><b>${s.k} kcal</b></div><div class="stat" style="background:var(--card2)"><small>Protein</small><b>${s.pr} g</b></div></div>
 <div><b>Ingredients</b> <small class="muted">· remove or add whatever you like, it's included</small></div>
 ${all.map(i=>{const on=cfg.ing.includes(i);return`<div class="ing ${on?'':'off'}"><div><span class="n">${ING[i].n}</span><br><small>${ING[i].k} kcal · ${ING[i].pr}g protein</small></div><button class="tog ${on?'':'add'}" onclick="togI('${i}')">${on?'−':'+'}</button></div>`}).join('')}
 <input placeholder="Note for the kitchen (e.g. sauce on the side)" value="${esc(cfg.note)}" oninput="cfg.note=this.value">
 ${m.mine?`<button class="btn ghost block" onclick="delRecipe('${m.id}')" style="color:var(--red)">🗑 Delete this recipe</button>`:''}
 </div>
 <div class="sticky"><div class="qty"><button onclick="cfg.q=Math.max(1,cfg.q-1);keep(drawMeal)">−</button><b>${cfg.q}</b><button onclick="cfg.q++;keep(drawMeal)">+</button></div>
 <button class="btn" style="flex:1" onclick="addMeal()">Add · ${eur(p*cfg.q)}</button></div>`);
}
function keep(fn){const sc=$('#modal').scrollTop;fn();$('#modal').scrollTop=sc}
function togI(i){cfg.ing=cfg.ing.includes(i)?cfg.ing.filter(x=>x!==i):[...cfg.ing,i];keep(drawMeal)}
function addMeal(){
 const m=allMeals().find(x=>x.id===cfg.id);if(!cfg.ing.length)return toast('Add at least one ingredient');
 const s=mealStats(cfg.ing,cfg.size),rem=m.ing.filter(i=>!cfg.ing.includes(i)).map(i=>ING[i].n),add=cfg.ing.filter(i=>!m.ing.includes(i)).map(i=>ING[i].n);
 cart.push({key:Date.now()+'',n:`${m.n} (${SIZES[cfg.size].n})`,e:m.e,p:SIZES[cfg.size].p,q:cfg.q,k:s.k,pr:s.pr,mods:[...add.map(x=>'+ '+x),...rem.map(x=>'no '+x)].join(', '),note:cfg.note});

// ---------- COACH AI ----------
const ALIAS={chicken:'chicken',beef:'beef',steak:'beef',salmon:'salmon',tuna:'tuna',tofu:'tofu',egg:'eggs',turkey:'turkey',shrimp:'shrimp',prawn:'shrimp',rice:'rice',quinoa:'quinoa','sweet potato':'sweetp',pasta:'pasta',oat:'oats',avocado:'avocado',broccoli:'broccoli',spinach:'spinach',edamame:'edamame',chickpea:'chickpeas',tomato:'tomato',cucumber:'cucumber',mango:'mango',banana:'banana',berr:'berries',feta:'feta',almond:'almonds',peanut:'pb',whey:'whey',yogurt:'greek',yoghurt:'greek',parm:'parm',pesto:'pesto',sesame:'sesame',soy:'sesame',tahini:'tahini',honey:'honey',poulet:'chicken','bœuf':'beef',boeuf:'beef',saumon:'salmon',thon:'tuna',dinde:'turkey',crevette:'shrimp',riz:'rice',avocat:'avocado'};
const GROUP={fish:['salmon','tuna','shrimp'],seafood:['salmon','tuna','shrimp'],poisson:['salmon','tuna','shrimp'],meat:['beef','chicken','turkey'],viande:['beef','chicken','turkey'],dairy:['feta','greek','parm','whey'],lactose:['feta','greek','parm','whey'],gluten:['pasta','oats'],nut:['almonds','pb'],carb:['rice','quinoa','sweetp','pasta','oats']};
const NEG=/(no|without|sans|pas de|avoid|hate|allerg\w*( to)?|not|except|zero|free of)\s+([\w\s,&-]{0,22})$/;
const PIMG={chicken:'m1',salmon:'m2',beef:'m3',turkey:'m4',shrimp:'m5',tofu:'m7',eggs:'m9',tuna:'m10'};
let coachMeals=[],chatInit=false,busy=false;
function toggleChat(force){const c=$('#chat'),open=force===true?true:c.classList.contains('shut');c.classList.toggle('shut',!open);$('#coachFab').classList.toggle('hidden',open);
 if(open){if(!chatInit){chatInit=true;greet()}setTimeout(()=>$('#cq').focus(),250)}}
$('#coachFab').onclick=()=>toggleChat(true);
const scrollC=()=>{const m=$('#cmsgs');m.scrollTop=m.scrollHeight};
function push(html,who='bot',cls=''){const d=document.createElement('div');d.className=`msg ${who} ${cls}`;d.innerHTML=html;$('#cmsgs').appendChild(d);scrollC();return d}
function bot(html,ms=650,cls=''){return new Promise(res=>{const t=push('<div class="typing"><i></i><i></i><i></i></div>','bot');t.style.padding='0';
 setTimeout(()=>{t.remove();res(push(html,'bot',cls))},ms)})}
function chips(list){const d=document.createElement('div');d.className='qchips';d.innerHTML=list.map(x=>`<button>${x}</button>`).join('');
 d.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.remove();ask(b.textContent)});$('#cmsgs').appendChild(d);scrollC()}
function todayIntake(){const k=dayKey(Date.now());let kc=0,pr=0;orders.forEach(o=>{if(dayKey(o.at)===k)o.items.forEach(i=>{kc+=i.k*i.q;pr+=i.pr*i.q})});return{kc,pr}}
async function greet(){const t=todayIntake();
 await bot(`Ciao <b>${esc(me.name)}</b>! 👋 I'm your MealPrepper coach. Your targets: <b>${me.kcal} kcal</b> & <b>${me.prot} g protein</b> a day (${GOALS[me.goal]}).`,700);
 await bot(`Today you still have <b>${Math.max(0,me.kcal-t.kc)} kcal</b> and <b>${Math.max(0,me.prot-t.pr)} g protein</b> left. Tell me your training, cravings or restrictions — I'll cook up the perfect meal 🍽️`,900);
 chips(['🏃 Pre-match meal, 40g protein','💪 Post-workout, no fish','🥗 Light vegan dinner','🍳 High-protein breakfast','📅 Plan my week','🛵 Where is my order?'])}
$('#cform').onsubmit=e=>{e.preventDefault();const q=$('#cq').value.trim();if(!q||busy)return;$('#cq').value='';ask(q)};
async function ask(q){busy=true;push(esc(q),'me');document.querySelectorAll('.qchips').forEach(x=>x.remove());const t=q.toLowerCase();
 try{
 if(/plan|week|semaine/.test(t)){await bot('Analysing your targets and building 7 balanced days… 🧠',900);generatePlan();cat='Meal plan';render();const T=planTotals();
  await bot(`Done ✅ Your week is ready: <b>${T.n} items</b>, avg <b>${T.avgK} kcal</b> & <b>${T.avgP} g protein</b>/day — right on your targets. Every meal is swappable, and the whole week is <b>${eur(T.price*.85)}</b> with the −15% subscription.`,1100);
  chips(['🔄 Regenerate my week','🏃 Pre-match meal, 40g protein']);return}
 if(/where|track|order|livr|commande|rider|delivery/.test(t)){const o=orders.slice().reverse().find(o=>Date.now()<o.arrive);
  if(o){await bot(`Your order <b>#${o.id}</b> is on its way — opening the live map 🗺️`);track(o.id)}else await bot('No order in progress right now. Want me to build you a meal? 😋');
  chips(['💪 Post-workout, no fish','📅 Plan my week']);return}
 if(/^(hi|hey|hello|ciao|salut|bonjour|yo)\b/.test(t)&&t.length<12){await bot('Ciao! 💙 What are you training today?');chips(['🏃 Pre-match meal, 40g protein','💪 Post-workout, no fish','🥗 Light vegan dinner']);return}
 await bot(pickLine(t),800);
 const m=compose(q,0);coachMeals.push(m);await bot(mealCardHTML(m,coachMeals.length-1),900,'wide');
 chips(['🔄 Another idea','🌶️ Make it bigger','📅 Plan my week']);
 }finally{busy=false}}
function pickLine(t){if(/match|game|race|marathon|competition|avant/.test(t))return'Game day! ⚽ Loading you with clean, fast-digesting carbs and lean protein, low fat so you feel light…';
 if(/post|after|recover|récup|workout|gym|training|leg|entrainement/.test(t))return'Recovery mode 💪 Prioritising protein for muscle repair plus carbs to refill glycogen…';
 if(/breakfast|morning|matin/.test(t))return'Rise & grind ☀️ A protein-packed breakfast coming up…';
 if(/light|léger|cut|lean|weight|perte|diet|vegan|salad/.test(t))return'Keeping it light but filling 🥗 High volume, high protein, low calories…';
 if(/another|autre|bigger|more|plus/.test(t))return'On it — tweaking the recipe 👨‍🍳';
 return'Got it! Crunching your macros 🧮…'}
function compose(q,seed){
 const prev=coachMeals[coachMeals.length-1];let t=q.toLowerCase();
 if(/another|autre|different/.test(t)&&prev){t=prev.q;seed=prev.seed+1}
 if(/bigger|more|plus|hungry|faim/.test(t)&&prev&&t.length<25){return{...prev,size:prev.size==='S'?'M':'L',why:['Bumped up the portion 🔥',...prev.why.slice(1)],...mealStats(prev.ing,prev.size==='S'?'M':'L')}}
 const ex=new Set(),want=new Set(),neg=w=>{const i=t.indexOf(w);return i>=0&&NEG.test(t.slice(Math.max(0,i-26),i))};
 for(const [w,k] of Object.entries(ALIAS))if(t.includes(w))(neg(w)?ex:want).add(k);
 for(const [w,ks] of Object.entries(GROUP))if(t.includes(w)&&neg(w))ks.forEach(k=>ex.add(k));
 const vegan=/vegan|végan|plant/.test(t),veggie=vegan||/veggie|vegetarian|végé/.test(t);
 if(veggie)['beef','chicken','turkey','salmon','tuna','shrimp'].forEach(k=>ex.add(k));if(vegan)['feta','greek','parm','whey','eggs','honey'].forEach(k=>ex.add(k));
 const pT=+((t.match(/(\d{2,3})\s*g/)||[])[1])||0,kT=+((t.match(/(\d{3,4})\s*k?cal/)||[])[1])||0;
 const ctx=/match|game|race|marathon|competition|avant/.test(t)?'pre':/post|after|recover|récup|workout|gym|training|leg/.test(t)?'post':/breakfast|morning|matin/.test(t)?'bf':/light|léger|cut|lean|weight|perte|diet|sèche/.test(t)?'lean':/bulk|mass|gain|big/.test(t)?'bulk':{perf:'pre',cut:'lean',bulk:'bulk',maint:'post'}[me.goal];
 const C={pre:{p:['chicken','turkey','tuna','tofu','shrimp'],c:['pasta','rice','sweetp'],v:['tomato','spinach','cucumber','broccoli'],s:['pesto','sesame','honey'],n:'Pre-Match'},
  post:{p:['chicken','salmon','beef','tofu','turkey'],c:['rice','sweetp','quinoa'],v:['spinach','broccoli','edamame','avocado'],s:['sesame','tahini'],n:'Recovery'},
  lean:{p:['turkey','tuna','shrimp','tofu','chicken'],c:['quinoa','chickpeas'],v:['spinach','cucumber','tomato','broccoli'],s:['tahini','sesame'],n:'Lean'},
  bulk:{p:['beef','chicken','salmon','tofu'],c:['rice','sweetp','pasta'],v:['avocado','broccoli','edamame'],s:['parm','pesto','sesame'],n:'Mass'},
  bf:{p:['whey','eggs','greek','tofu'],c:['oats','sweetp'],v:['berries','banana','spinach'],s:['almonds','pb','honey'],n:'Power'}}[ctx];
 const ok=a=>a.filter(k=>!ex.has(k)),rot=(a,n)=>a.length?a[(n)%a.length]:null;
 const P=ok(C.p),Ca=ok(C.c),V=ok(C.v),S=ok(C.s);
 const wantP=[...want].filter(k=>['chicken','beef','salmon','tuna','tofu','eggs','turkey','shrimp','whey','greek'].includes(k));
 let ing=[...new Set([wantP[0]||rot(P,seed)||'tofu',rot(Ca,seed),rot(V,seed),rot(V,seed+1),rot(S,seed),...[...want].filter(k=>!ex.has(k))])].filter(Boolean).filter(k=>!ex.has(k));
 const pick=()=>{if(kT){return Object.keys(SIZES).reduce((a,b)=>Math.abs(mealStats(ing,b).k-kT)<Math.abs(mealStats(ing,a).k-kT)?b:a)}
  if(pT)return Object.keys(SIZES).reduce((a,b)=>Math.abs(mealStats(ing,b).pr-pT)<Math.abs(mealStats(ing,a).pr-pT)?b:a);
  return ctx==='lean'?'S':ctx==='bulk'?'L':'M'};
 let size=pick();
 if(pT&&mealStats(ing,size).pr<pT-6){const extra=P.find(k=>!ing.includes(k))||ok(['edamame','eggs','greek']).find(k=>!ing.includes(k));if(extra){ing.push(extra);size=pick()}}
 const st=mealStats(ing,size),main=ing.find(k=>PIMG[k])||'',carb=ing.find(k=>C.c.includes(k));
 const img=(MEALS.find(m=>m.id===(ctx==='bf'?'m8':carb==='pasta'?'m6':PIMG[main]))||MEALS[0]).img;
 const cap=w=>w[0].toUpperCase()+w.slice(1),nm=`${C.n} ${cap(ING[ing[0]].n.replace(/^(Grilled|Marinated|Seared|Vanilla|0% )\s*/,''))}${carb?' & '+cap(ING[carb].n.split(' ').pop()):''} ${ctx==='bf'?'Box':'Bowl'}`;
 const why=[{pre:'⚡ Carb-forward, low-fat: quick energy, easy digestion before effort',post:'🔁 Protein + carbs combo for muscle repair & glycogen refill',lean:'🥬 High volume, low calorie density — full without the kcal',bulk:'🔥 Calorie-dense with quality fats and complete protein',bf:'☀️ Slow carbs + fast protein to start the day strong'}[ctx]];
 if(pT)why.push(`🎯 ${st.pr} g protein — target ${pT} g ${Math.abs(st.pr-pT)<=8?'✓':''}`);else why.push(`🎯 ${Math.round(st.pr/me.prot*100)}% of your daily protein in one meal`);
 if(kT)why.push(`🔥 ${st.k} kcal — target ${kT}`);
 if(ex.size)why.push('🚫 Excluded: '+[...ex].map(k=>ING[k].n.toLowerCase()).slice(0,4).join(', '));
 return{q:t,seed,n:nm,e:{pre:'⚡',post:'💪',lean:'🥗',bulk:'🔥',bf:'🥣'}[ctx],img,ing,size,why,...st}}
function mealCardHTML(m,i){const pc=Math.min(100,m.pr/me.prot*100),kc=Math.min(100,m.k/me.kcal*100);
 return`<div class="cmeal"><div class="img">${m.e}${pic(m.img)}</div><div class="b"><div class="row"><b style="font-size:15px">${esc(m.n)}</b><span class="tag g">${SIZES[m.size].n}</span></div>
 <div class="gauge"><div class="row"><span>🔥 <b style="color:var(--txt)">${m.k}</b> kcal</span><span>${Math.round(kc)}% of day</span></div><div class="pbar" style="height:6px"><i style="width:${kc}%"></i></div>
 <div class="row"><span>💪 <b style="color:var(--txt)">${m.pr} g</b> protein</span><span>${Math.round(pc)}% of day</span></div><div class="pbar" style="height:6px"><i style="width:${pc}%;background:#7b5cff"></i></div></div>
 <div class="ipills">${m.ing.map(k=>`<span>${ING[k].n}</span>`).join('')}</div><div class="why">${m.why.map(w=>`<div>${w}</div>`).join('')}</div>
 <div class="cbtns"><button class="btn" onclick="coachAdd(${i})">🛒 Add · ${eur(SIZES[m.size].p)}</button><button class="btn ghost" onclick="coachSave(${i})">⭐ Save</button><button class="btn ghost" onclick="ask('🔄 Another idea')">🔄 Other</button></div></div></div>`}
function coachAdd(i){const m=coachMeals[i];cart.push({key:Date.now()+'',n:`${m.n} (${SIZES[m.size].n})`,e:m.e,p:SIZES[m.size].p,q:1,k:m.k,pr:m.pr,mods:'Composed by Coach AI',note:''});save();render();toast('Added to cart ✓');bot(`Added to your cart 🛒 — delivered in about <b>${eta()[0]} min</b>. Anything else?`).then(()=>chips(['🛒 Checkout','🥤 Add a recovery drink']))}
function coachSave(i){const m=coachMeals[i];if(m.saved)return toast('Already saved');m.saved=1;recipes.push({id:'r'+Date.now(),img:m.img,mine:true,cat:'My recipes',e:m.e,n:m.n,d:m.ing.map(k=>ING[k].n).join(', '),ing:m.ing,ext:[],goal:[]});save();render();toast('Saved to My recipes ⭐')}
const _ask=ask;ask=async q=>{if(/checkout/i.test(q)){push(esc(q),'me');document.querySelectorAll('.qchips').forEach(x=>x.remove());toggleChat(false);return openCart()}
 if(/recovery drink/i.test(q)){push(esc(q),'me');document.querySelectorAll('.qchips').forEach(x=>x.remove());addDrink('d2');return bot('Recovery Smoothie added 🍓 — 12 g protein, perfect with your meal.')}
 if(/regenerate/i.test(q))return _ask('plan my week');return _ask(q)};

// ---------- PROFILE ----------
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function openProfile(){
 const days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push({key:dayKey(d),label:i===0?'Today':i===1?'Yesterday':d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}),short:d.toLocaleDateString('en-GB',{weekday:'short'}),meals:[]})}
 orders.forEach(o=>{const d=days.find(x=>x.key===dayKey(o.at));if(d)o.items.forEach(it=>d.meals.push({...it,t:o.at}))});
 days.forEach(d=>{d.k=d.meals.reduce((s,m)=>s+m.k*m.q,0);d.pr=d.meals.reduce((s,m)=>s+m.pr*m.q,0);d.meals.sort((a,b)=>a.t-b.t)});
 const max=Math.max(me.kcal,...days.map(d=>d.k)),bar=(v,t)=>`<div class="pbar"><i class="${v>t?'over':''}" style="width:${Math.min(100,v/t*100)}%"></i></div>`,avg=Math.round(days.slice(1).reduce((s,d)=>s+d.k,0)/6);
 modal(`<div class="mbody"><div class="row"><div class="row" style="justify-content:flex-start"><span class="avatar" style="width:48px;height:48px;font-size:20px">${esc(me.name[0].toUpperCase())}</span><div><h2 style="margin:0">${esc(me.name)}</h2><small class="muted">${esc(me.email)} · ${esc(me.sport)}</small></div></div><button class="tog" onclick="closeM()">✕</button></div>
 <b>🎯 My targets</b>
 <div class="kv"><label class="f">Sex<select id="pSex"><option value="m" ${me.sex==='m'?'selected':''}>Male</option><option value="f" ${me.sex==='f'?'selected':''}>Female</option></select></label><label class="f">Height (cm)<input id="pH" type="number" value="${me.height||(me.sex==='f'?165:178)}" oninput="updBMI()"></label></div>
 <div class="kv"><label class="f">Current weight (kg)<input id="pW" type="number" step="0.1" value="${me.weight}" oninput="updBMI()"></label><label class="f">Target weight (kg)<input id="pTW" type="number" step="0.1" value="${me.targetW||me.weight}" oninput="updBMI()"></label></div>
 <div class="citem" id="bmiBox"></div>
 <label class="f">Goal<select id="pGoal">${Object.entries(GOALS).map(([k,v])=>`<option value="${k}" ${me.goal===k?'selected':''}>${v}</option>`).join('')}</select></label>
 <div class="kv"><label class="f">Calories / day<input id="pK" type="number" value="${me.kcal}"></label><label class="f">Protein / day (g)<input id="pP" type="number" value="${me.prot}"></label></div>
 <div class="kv"><button class="btn ghost" onclick="const g=suggest($('#pSex').value,+$('#pW').value,$('#pGoal').value,+$('#pH').value);$('#pK').value=g.kcal;$('#pP').value=g.prot">✨ Suggest</button><button class="btn" onclick="saveProfile()">Save</button></div>
 <b>📊 Last 7 days</b> <small class="muted" style="margin-top:-10px">Average ${avg} kcal/day · target ${me.kcal}</small>
 <div class="week">${days.slice().reverse().map(d=>`<div><small>${d.k||''}</small><i style="height:${d.k/max*100}%;${d.k>me.kcal?'background:#f59e0b':''}"></i>${d.short}</div>`).join('')}</div>
 ${days.map(d=>`<div class="day"><div class="row"><b>${d.label}</b><small class="muted">${d.k} / ${me.kcal} kcal · ${d.pr} / ${me.prot} g prot</small></div>${bar(d.k,me.kcal)}${bar(d.pr,me.prot)}
  ${d.meals.length?d.meals.map(m=>`<div class="meal-row"><span>${new Date(m.t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${m.e} ${m.q>1?m.q+'× ':''}${esc(m.n)}</span><span>${m.k*m.q} kcal · ${m.pr*m.q}g</span></div>`).join(''):'<small class="muted">No meals ordered</small>'}</div>`).join('')}
 <button class="btn ghost block" onclick="logout()" style="color:var(--red)">Log out</button></div>`);updBMI()}
function bmiOf(w,h){return h?w/((h/100)**2):0}
function bmiCat(b){return b<18.5?['Underweight','#f59e0b']:b<25?['Healthy','#16a34a']:b<30?['Overweight','#f59e0b']:['Obese','#e5484d']}
function updBMI(){const h=+$('#pH').value,w=+$('#pW').value,tw=+$('#pTW').value;if(!h||!w)return $('#bmiBox').innerHTML='<small>Enter height & weight to compute your BMI</small>';
 const b=bmiOf(w,h),tb=bmiOf(tw||w,h),[c,col]=bmiCat(b),[tc]=bmiCat(tb),pos=v=>Math.max(0,Math.min(100,(v-15)/(40-15)*100)),diff=(tw||w)-w;
 $('#bmiBox').innerHTML=`<div class="row"><div><small>Your BMI</small><div style="font-size:30px;font-weight:800;color:${col};line-height:1.1">${b.toFixed(1)}</div><b style="color:${col};font-size:13px">${c}</b></div>
 <div style="text-align:right"><small>Target BMI</small><div style="font-size:22px;font-weight:800">${tb.toFixed(1)}</div><small>${tc} · ${Math.abs(diff)<.05?'at target 🎯':(diff<0?'−':'+')+Math.abs(diff).toFixed(1)+' kg to go'}</small></div></div>
 <div style="position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#f59e0b 0 14%,#16a34a 14% 40%,#f59e0b 40% 60%,#e5484d 60%);margin:8px 0 2px">
 <span style="position:absolute;left:calc(${pos(tb)}% - 6px);top:-3px;width:12px;height:16px;border-radius:4px;border:2px dashed var(--txt);background:#fff9"></span>
 <span style="position:absolute;left:calc(${pos(b)}% - 8px);top:-4px;width:16px;height:18px;border-radius:5px;background:var(--txt);border:2px solid #fff"></span></div>
 <div style="position:relative;height:14px;font-size:10px;color:var(--mut)">${[15,18.5,25,30,40].map(v=>`<span style="position:absolute;left:${pos(v)}%;transform:translateX(-${pos(v)}%)">${v}</span>`).join('')}</div>`}
function saveProfile(){me.height=+$('#pH').value||me.height;me.targetW=+$('#pTW').value||me.targetW;me.sex=$('#pSex').value;me.weight=+$('#pW').value||me.weight;me.goal=$('#pGoal').value;me.kcal=+$('#pK').value||me.kcal;me.prot=+$('#pP').value||me.prot;save();render();openProfile();toast('Profile saved ✓')}

// ---------- UI UTILS ----------
function modal(h){if(tmap){try{tmap.remove()}catch{}tmap=null}$('#modal').innerHTML=h;$('#ov').classList.remove('hidden')}
function closeM(){$('#ov').classList.add('hidden');clearInterval(trackT)}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeM()};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hidden'),2000)}

const s=LS.get('mp_session',null);if(s&&users[s])login(users[s]);
</script>
